<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>分选分配率计算</title>
  <style>
    :root {
      --bg: #eef3f7;
      --panel: #ffffff;
      --line: #1f2933;
      --soft-line: #c8d6e2;
      --text: #142234;
      --muted: #63748a;
      --head: #c6e0b4;
      --blue: #9fc5e3;
      --green: #239267;
      --red: #f00000;
      --yellow: #fff200;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei", Arial, sans-serif;
      font-size: 14px;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--soft-line);
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
    }
    h1 { margin: 0; font-size: 20px; line-height: 1.2; }
    .hint { color: var(--muted); font-size: 13px; }
    .tools {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 10px;
    }
    label.control {
      display: grid;
      grid-template-columns: auto minmax(92px, auto);
      align-items: center;
      gap: 8px;
      color: var(--muted);
    }
    select, input[type="number"] {
      height: 34px;
      border: 1px solid var(--soft-line);
      border-radius: 6px;
      padding: 0 8px;
      background: #fff;
      color: var(--text);
      font: inherit;
    }
    input[type="number"] { width: 92px; }
    button {
      height: 34px;
      border: 1px solid var(--soft-line);
      border-radius: 6px;
      padding: 0 12px;
      background: #fff;
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }
    main {
      display: grid;
      grid-template-columns: minmax(620px, 1.15fr) minmax(420px, 0.85fr);
      gap: 14px;
      padding: 14px;
    }
    .panel {
      overflow: hidden;
      border: 1px solid var(--soft-line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 8px 24px rgba(20, 43, 70, 0.08);
    }
    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--soft-line);
      font-weight: 700;
    }
    .table-wrap { overflow: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    th, td {
      border: 1px solid var(--line);
      padding: 6px 8px;
      text-align: center;
      white-space: nowrap;
    }
    th { background: #f8fafc; font-weight: 700; }
    .param-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(130px, 1fr));
      gap: 10px;
      padding: 14px;
      border-bottom: 1px solid var(--soft-line);
    }
    .param-card {
      border: 1px solid var(--soft-line);
      border-radius: 8px;
      padding: 10px 12px;
      background: #fbfdff;
    }
    .param-card span {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 12px;
    }
    .param-card strong {
      display: block;
      font-size: 20px;
      line-height: 1.1;
    }
    .input-table { min-width: 760px; }
    .input-table th:first-child,
    .input-table td:first-child { width: 112px; }
    .input-table th:nth-child(2),
    .input-table td:nth-child(2) { width: 76px; }
    .input-table .size-yield-col { width: 88px; }
    .input-table .ash-col,
    .input-table .raw-yield-col { width: 92px; }
    .input-table .size-head { background: var(--head); }
    .input-table .param-name { background: var(--yellow); color: var(--text); font-weight: 700; }
    .input-table .param-value { background: #fffef0; color: var(--red); font-weight: 700; cursor: text; }
    .input-table td[contenteditable="true"] { cursor: text; }
    .input-table td[contenteditable="true"]:focus,
    .result-table td[contenteditable="true"]:focus {
      outline: 2px solid var(--green);
      outline-offset: -2px;
      background: #fff;
    }
    .input-table .density-col { color: var(--red); font-weight: 700; }
    .result-table {
      max-width: 760px;
      margin: 14px auto;
      border: 3px solid var(--yellow);
    }
    .result-table th { background: #fff; font-size: 20px; }
    .result-table .size-title th { background: var(--head); font-size: 22px; }
    .result-table td {
      font-size: 20px;
      background: #fff;
    }
    .result-table .sum-row td {
      background: #e2efda;
      font-weight: 700;
    }
    .result-table .rate-col { color: #000; }
    .result-table .sum-yield { color: var(--red); }
    .formula {
      margin: 0 14px 14px;
      border: 1px solid var(--soft-line);
      border-radius: 8px;
      padding: 10px 12px;
      background: #f8fafc;
      color: var(--muted);
      font-family: Consolas, "Microsoft YaHei", monospace;
      line-height: 1.7;
    }
    @media (max-width: 980px) {
      header { align-items: flex-start; flex-direction: column; }
      main { grid-template-columns: 1fr; }
      .tools { justify-content: flex-start; }
      .param-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>

    const modeSelect = document.getElementById("modeSelect");
    const sizeSelect = document.getElementById("sizeSelect");
    const cutDensityInput = document.getElementById("cutDensityInput");
    const epInput = document.getElementById("epInput");

    function fmt(value, digits = 2) {
      const n = Number(value);
      return Number.isFinite(n) ? n.toFixed(digits) : "-";
    }

    function normsdist(x) {
      const z = Number(x);
      if (!Number.isFinite(z)) return 0;
      const t = 1 / (1 + 0.2316419 * Math.abs(z));
      const d = 0.3989423 * Math.exp((-z * z) / 2);
      const p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
      return z > 0 ? 1 - p : p;
    }

    function rejectRate(density, cutDensity, ep) {
      const epSafe = Math.max(Math.abs(Number(ep) || 0.03), 0.001);
      return normsdist((0.675 * (Number(density) - Number(cutDensity))) / epSafe);
    }

    function activeGroup() {
      return sizeData.find((item) => item.size === sizeSelect.value) || sizeData.find((item) => item.size === "150-100") || sizeData[0];
    }

    function visibleGroups() {
      if (sizeSelect.value === "__all__") {
        return sizeData.map((group, index) => ({ group, index }));
      }
      const index = sizeData.findIndex((item) => item.size === sizeSelect.value);
      const safeIndex = index >= 0 ? index : 0;
      return [{ group: sizeData[safeIndex], index: safeIndex }];
    }

    function activeParams() {
      const group = activeGroup();
      return { density: Number(group.cutDensity) || 1.70, ep: Number(group.ep) || 0.02 };
    }

    function productRows() {
      const meta = modeMeta[modeSelect.value];
      const params = activeParams();
      const group = activeGroup();
      const rawYieldTotal = group.rows.reduce((sum, row) => sum + (Number(row.yield) || 0), 0);
      const sizeYieldTotal = group.rows.reduce((sum, row) => sum + (Number(row.sizeYield) || 0), 0);
      return densityRows.map((densityRow, index) => {
        const raw = group.rows[index] || { sizeYield: 0, ash: 0, yield: 0 };
        const effectiveRawYield = sizeYieldTotal > 0
          ? rawYieldTotal * ((Number(raw.sizeYield) || 0) / sizeYieldTotal)
          : Number(raw.yield) || 0;
        const reject = rejectRate(densityRow.density, params.density, params.ep);
        const rate = meta.product === "reject" ? reject : 1 - reject;
        const productYield = effectiveRawYield * rate;
        return {
          ...densityRow,
          rate,
          ash: Number(raw.ash) || 0,
          rawYield: effectiveRawYield,
          productYield,
        };
      });
    }

    function summary(rows) {
      const totalYield = rows.reduce((sum, row) => sum + row.productYield, 0);
      const ash = totalYield > 0
        ? rows.reduce((sum, row) => sum + row.productYield * row.ash, 0) / totalYield
        : 0;
      return { totalYield, ash };
    }

    function renderSizeOptions() {
      sizeSelect.innerHTML = `<option value="__all__">显示所有</option>` + sizeData.map((item) => `<option value="${item.size}">${item.size}</option>`).join("");
      sizeSelect.value = "150-100";
    }

    function renderInput() {
      const groups = visibleGroups();
      inputTable.style.minWidth = `${Math.max(760, 188 + groups.length * 300)}px`;
      inputTable.innerHTML = `
        <colgroup>
          <col style="width: 112px">
          <col style="width: 76px">
          ${groups.map(() => `
            <col class="size-yield-col">
            <col class="ash-col">
            <col class="raw-yield-col">
          `).join("")}
        </colgroup>
        <thead>
          <tr>
            <th rowspan="2">密度级(kg/l)</th>
            <th rowspan="2">密度</th>
            ${groups.map(({ group }) => `<th class="size-head" colspan="3">${group.size}</th>`).join("")}
          </tr>
          <tr>
            ${groups.map(() => `<th>占本级(%)</th><th>灰分(%)</th><th>原占全样(%)</th>`).join("")}
          </tr>
        </thead>
        <tbody>
          ${densityRows.map((density, index) => {
            return `
              <tr>
                <td class="density-col">${density.label}</td>
                <td class="density-col">${fmt(density.density, 2)}</td>
                ${groups.map(({ group, index: groupIndex }) => {
                  const row = group.rows[index] || { sizeYield: 0, ash: 0, yield: 0 };
                  return `
                    <td contenteditable="true" data-group="${groupIndex}" data-row="${index}" data-field="sizeYield">${fmt(row.sizeYield, 2)}</td>
                    <td contenteditable="true" data-group="${groupIndex}" data-row="${index}" data-field="ash">${fmt(row.ash, 2)}</td>
                    <td contenteditable="true" data-group="${groupIndex}" data-row="${index}" data-field="yield">${fmt(row.yield, 3)}</td>
                  `;
                }).join("")}
              </tr>
            `;
          }).join("")}
        </tbody>
        <tfoot>
          ${[
            ["分选密度δ", "cutDensity", 2],
            ["可能偏差Ep", "ep", 3],
          ].map(([label, field, digits]) => `
            <tr>
              <td class="param-name" colspan="2">${label}</td>
              ${groups.map(({ group, index: groupIndex }) => `
                <td class="param-value" contenteditable="true" colspan="3" data-param-group="${groupIndex}" data-param-field="${field}" data-param-digits="${digits}">${fmt(group[field], digits)}</td>
              `).join("")}
            </tr>
          `).join("")}
        </tfoot>
      `;
    }

    function renderResult() {
      const meta = modeMeta[modeSelect.value];
      const group = activeGroup();
      const params = activeParams();
      const rows = productRows();
      const total = summary(rows);
      resultTable.innerHTML = `
        <thead>
          <tr class="size-title"><th colspan="5">${group.size}</th></tr>
          <tr><th>密度级</th><th>密度</th><th>分配率</th><th>灰分<br>(%)</th><th>占全样<br>(%)</th></tr>
        </thead>
        <tbody>
          ${rows.map((row) => `
            <tr>
              <td>${row.label}</td>
              <td>${fmt(row.density, 2)}</td>
              <td class="rate-col">${fmt(row.rate * 100, 0)}%</td>
              <td>${fmt(row.ash, 2)}</td>
              <td>${fmt(row.productYield, 2)}</td>
            </tr>
          `).join("")}
          <tr class="sum-row"><td>合计</td><td></td><td></td><td>${fmt(total.ash, 2)}</td><td class="sum-yield">${fmt(total.totalYield, 2)}</td></tr>
        </tbody>
      `;
      document.getElementById("activeHint").textContent = `${meta.title} · δ=${fmt(params.density, 2)} · Ep=${fmt(params.ep, 3)}`;
      const example = rows[4];
      const reject = rejectRate(example.density, params.density, params.ep);
      document.getElementById("formulaBox").innerHTML = `
        Excel 示例：NORMSDIST(0.675*(${fmt(example.density, 2)}-${fmt(params.density, 2)})/${fmt(params.ep, 3)}) = ${fmt(reject * 100, 2)}%<br>
        当前「${meta.title}」分配率 = ${meta.product === "reject" ? "矸石分配率" : "1 - 矸石分配率"}；占全样 = 原占全样 × 分配率。<br>
        汇总灰分 = SUMPRODUCT(灰分, 占全样) / SUM(占全样) = ${fmt(total.ash, 2)}%；汇总占全样 = ${fmt(total.totalYield, 3)}%。
      `;
    }

    function syncActiveParamInputs() {
      const group = activeGroup();
      cutDensityInput.value = fmt(group.cutDensity, 2);
      epInput.value = fmt(group.ep, 3);
    }

    function renderAll() {
      syncActiveParamInputs();
      renderInput();
      renderResult();
    }

    function setInputCellValue(groupIndex, rowIndex, field, value) {
      if (!Number.isFinite(value)) return;
      const group = sizeData[groupIndex];
      if (!group || !group.rows[rowIndex]) return;
      group.rows[rowIndex][field] = value;
    }

    function updateCell(event) {
      const paramCell = event.target.closest("[data-param-group]");
      if (paramCell) {
        const groupIndex = Number(paramCell.dataset.paramGroup);
        const field = paramCell.dataset.paramField;
        const value = Number(String(paramCell.textContent).trim());
        if (!Number.isFinite(value)) return;
        sizeData[groupIndex][field] = value;
        if (sizeData[groupIndex].size === sizeSelect.value) syncActiveParamInputs();
        renderResult();
        return;
      }
      const cell = event.target.closest("[data-group]");
      if (!cell) return;
      const groupIndex = Number(cell.dataset.group);
      const rowIndex = Number(cell.dataset.row);
      const field = cell.dataset.field;
      const value = Number(String(cell.textContent).trim());
      setInputCellValue(groupIndex, rowIndex, field, value);
      renderResult();
    }

    function normalizeCell(event) {
      const paramCell = event.target.closest("[data-param-group]");
      if (paramCell) {
        const groupIndex = Number(paramCell.dataset.paramGroup);
        const field = paramCell.dataset.paramField;
        const digits = Number(paramCell.dataset.paramDigits) || 2;
        const value = Number(String(paramCell.textContent).trim());
        if (Number.isFinite(value)) sizeData[groupIndex][field] = value;
        paramCell.textContent = Number.isFinite(value) ? fmt(value, digits) : "";
        if (sizeData[groupIndex].size === sizeSelect.value) syncActiveParamInputs();
        renderResult();
        return;
      }
      const cell = event.target.closest("[data-group]");
      if (!cell) return;
      const groupIndex = Number(cell.dataset.group);
      const rowIndex = Number(cell.dataset.row);
      const value = Number(String(cell.textContent).trim());
      if (Number.isFinite(value)) {
        setInputCellValue(groupIndex, rowIndex, cell.dataset.field, value);
      }
      renderInput();
      renderResult();
    }

    function resetPage() {
      sizeData = freshSizeData();
      modeSelect.value = "blockReject";
      renderSizeOptions();
      renderAll();
    }

    renderSizeOptions();
    renderAll();

    inputTable.addEventListener("input", updateCell);
    inputTable.addEventListener("blur", normalizeCell, true);
    modeSelect.addEventListener("change", renderResult);
    sizeSelect.addEventListener("change", renderAll);
    [cutDensityInput, epInput].forEach((input) => {
      input.addEventListener("input", () => {
        const group = activeGroup();
        group.cutDensity = Number(cutDensityInput.value) || group.cutDensity;
        group.ep = Number(epInput.value) || group.ep;
        renderInput();
        renderResult();
      });
    });
    document.getElementById("resetBtn").addEventListener("click", resetPage);
  </script>
</body>
</html>
