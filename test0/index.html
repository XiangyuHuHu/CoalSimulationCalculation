<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>浮沉分选计算测试</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef3f7;
      --panel: #ffffff;
      --line: #cbd7e2;
      --text: #122033;
      --muted: #607084;
      --blue: #0f78b8;
      --orange: #ef7b2d;
      --yellow: #fff45b;
      --sand: #ffe4a3;
      --green: #299c6b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei", Arial, sans-serif;
      font-size: 14px;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(10px);
    }
    h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
    }
    .tools {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .control {
      display: grid;
      grid-template-columns: auto 76px;
      align-items: center;
      gap: 8px;
      color: var(--muted);
    }
    input[type="number"] {
      width: 76px;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 8px;
      font: inherit;
      color: var(--text);
      background: #fff;
    }
    input[type="range"] { width: 180px; accent-color: var(--blue); }
    button {
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 12px;
      font: inherit;
      color: var(--text);
      background: #fff;
      cursor: pointer;
    }
    .hidden-file { display: none; }
    main {
      display: grid;
      gap: 14px;
      padding: 14px;
    }
    .panel {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 8px 24px rgba(20, 43, 70, 0.08);
    }
    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      font-weight: 700;
    }
    .hint {
      color: var(--muted);
      font-weight: 400;
    }
    .table-wrap {
      overflow: auto;
      max-height: calc(100vh - 315px);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1360px;
    }
    th, td {
      border: 1px solid #51606e;
      padding: 5px 7px;
      text-align: center;
      white-space: nowrap;
    }
    th {
      background: #f8fafc;
      font-weight: 700;
    }
    .density-head {
      color: #f23838;
      font-size: 16px;
    }
    .size-head {
      font-size: 17px;
      font-weight: 500;
    }
    .size-head:first-of-type { color: #f23838; }
    .unit-row th {
      color: var(--muted);
      font-weight: 500;
    }
    .low-row td { background: var(--yellow); }
    .high-row td { background: var(--sand); }
    .summary-row td { background: #fff; font-weight: 700; }
    td.density-cell {
      min-width: 108px;
      font-weight: 500;
      background: inherit;
    }
    td.editable {
      min-width: 76px;
      cursor: text;
    }
    td.editable:focus {
      outline: 2px solid var(--blue);
      outline-offset: -2px;
      background: #fff;
    }
    .results {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
      padding: 14px;
    }
    .result-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }
    .result-card h3 {
      margin: 0;
      padding: 10px 12px;
      background: #f4f7fa;
      font-size: 16px;
    }
    .metric-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }
    .metric {
      padding: 10px 12px;
      border-top: 1px solid var(--line);
    }
    .metric:nth-child(odd) { border-right: 1px solid var(--line); }
    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 4px;
    }
    .metric strong {
      display: block;
      font-size: 20px;
      line-height: 1.1;
    }
    .clean strong { color: var(--green); }
    .reject strong { color: var(--orange); }
    .formula-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 0 14px 14px;
    }
    .formula {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      background: #f9fbfd;
      color: var(--muted);
      font-family: Consolas, "Microsoft YaHei", monospace;
      line-height: 1.6;
    }
    @media (max-width: 760px) {
      header { align-items: flex-start; flex-direction: column; }
      .tools { width: 100%; }
      input[type="range"] { width: 130px; }
      .formula-bar { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>浮沉分选计算测试</h1>
      <div class="hint">按分选密度切分：低于密度进入精煤，高于等于密度进入矸石；灰分按 SUMPRODUCT 加权。</div>
    </div>
    <div class="tools">
      <label class="control">
        分选密度
        <input id="densityInput" type="number" min="1.3" max="2.0" step="0.1" value="1.6" />
      </label>
      <input id="densityRange" type="range" min="1.3" max="2.0" step="0.1" value="1.6" />
      <button id="importBtn" type="button">导入数据</button>
      <input id="importFile" class="hidden-file" type="file" accept=".json,.csv,application/json,text/csv" />
      <button id="exportJsonBtn" type="button">导出JSON</button>
      <button id="exportCsvBtn" type="button">导出CSV</button>
      <button id="resetBtn" type="button">恢复默认数据</button>
      <a href="../index.html"><button type="button">返回主流程</button></a>
    </div>
  </header>

  <main>
    <section class="panel">
      <div class="panel-title">
        <span>提供数据</span>
        <span class="hint">可直接点单元格修改“灰分”和“占全样”</span>
      </div>
      <div class="table-wrap">
        <table id="dataTable"></table>
      </div>
    </section>

    <section class="panel">
      <div class="panel-title">
        <span>计算结果</span>
        <span class="hint">产率单位为占全样 %，灰分单位为 %</span>
      </div>
      <div id="resultCards" class="results"></div>
      <div class="formula-bar">
        <div class="formula" id="cleanFormula"></div>
        <div class="formula" id="rejectFormula"></div>
      </div>
    </section>
  </main>

  <script>
    const densityRows = [
      { label: "<1.30", low: 1.30 },
      { label: "1.30-1.40", low: 1.40 },
      { label: "1.40-1.50", low: 1.50 },
      { label: "1.50-1.60", low: 1.60 },
      { label: "1.60-1.70", low: 1.70 },
      { label: "1.70-1.80", low: 1.80 },
      { label: "1.80-2.00", low: 2.00 },
      { label: ">2.00", low: Infinity },
    ];

    const defaultGroups = [
      {
        size: "+150",
        rows: [
          [37.28, 6.47, 1.82], [32.05, 7.71, 1.56], [0, 0, 0], [0, 0, 0],
          [0, 0, 0], [3.95, 58.90, 0.19], [5.45, 71.02, 0.27], [21.27, 90.19, 1.0351],
        ],
        slime: [0.23, 57.60, 0.01],
      },
      {
        size: "150-50",
        rows: [
          [30.87, 5.02, 3.77], [41.31, 8.63, 5.04], [2.32, 17.81, 0.28], [0.23, 27.52, 0.03],
          [1.18, 41.43, 0.14], [0.32, 53.94, 0.04], [0.28, 69.44, 0.03], [23.49, 87.25, 2.87],
        ],
        slime: [1.25, 54.26, 0.15],
      },
      {
        size: "50-25",
        rows: [
          [17.42, 4.10, 2.09], [25.20, 8.99, 3.03], [4.36, 16.97, 0.52], [1.39, 29.19, 0.17],
          [1.70, 46.14, 0.20], [1.20, 51.86, 0.14], [2.90, 61.16, 0.35], [45.83, 88.59, 5.51],
        ],
        slime: [2.31, 60.87, 0.28],
      },
      {
        size: "25-13",
        rows: [
          [20.72, 3.77, 2.08], [33.39, 8.44, 3.34], [6.58, 17.14, 0.66], [1.00, 31.20, 0.10],
          [1.27, 42.70, 0.13], [1.14, 49.74, 0.11], [2.46, 60.83, 0.25], [33.45, 87.03, 3.35],
        ],
        slime: [4.13, 55.57, 0.43],
      },
      {
        size: "13-10",
        rows: [
          [21.71, 3.91, 1.06], [33.30, 8.85, 1.63], [5.58, 16.86, 0.27], [0.78, 33.77, 0.04],
          [1.17, 42.11, 0.06], [1.13, 50.35, 0.06], [1.35, 56.92, 0.07], [34.97, 86.94, 1.71],
        ],
        slime: [4.65, 61.88, 0.24],
      },
      {
        size: "10-8",
        rows: [
          [26.29, 4.19, 1.25], [31.78, 9.31, 1.51], [4.24, 18.30, 0.20], [0.80, 35.73, 0.04],
          [1.15, 44.02, 0.05], [0.68, 51.92, 0.03], [1.43, 60.23, 0.07], [33.62, 86.80, 1.60],
        ],
        slime: [3.63, 67.56, 0.18],
      },
    ];

    let groups = structuredClone(defaultGroups);

    const table = document.getElementById("dataTable");
    const cards = document.getElementById("resultCards");
    const densityInput = document.getElementById("densityInput");
    const densityRange = document.getElementById("densityRange");

    function fmt(value, digits = 2) {
      const n = Number(value);
      return Number.isFinite(n) ? n.toFixed(digits) : "-";
    }

    function weightedAsh(rows) {
      const total = rows.reduce((sum, row) => sum + row.yield, 0);
      if (total <= 0) return 0;
      return rows.reduce((sum, row) => sum + row.yield * row.ash, 0) / total;
    }

    function calcGroup(group, density) {
      const rows = group.rows.map((row, index) => ({
        label: densityRows[index].label,
        boundary: densityRows[index].low,
        grade: Number(row[0]) || 0,
        ash: Number(row[1]) || 0,
        yield: Number(row[2]) || 0,
      }));
      const cleanRows = rows.filter((row) => row.boundary <= density);
      const rejectRows = rows.filter((row) => row.boundary > density);
      const cleanYield = cleanRows.reduce((sum, row) => sum + row.yield, 0);
      const rejectYield = rejectRows.reduce((sum, row) => sum + row.yield, 0);
      return {
        size: group.size,
        cleanYield,
        cleanAsh: weightedAsh(cleanRows),
        rejectYield,
        rejectAsh: weightedAsh(rejectRows),
        cleanRows,
        rejectRows,
      };
    }

    function renderTable() {
      const colGroup = groups.map((group) => `<th class="size-head" colspan="3">${group.size}</th>`).join("");
      const subHeads = groups.map(() => "<th>占本级</th><th>灰分</th><th>占全样</th>").join("");
      const units = groups.map(() => "<th>%</th><th>%</th><th>%</th>").join("");
      const bodyRows = densityRows.map((density, rowIndex) => {
        const cls = rowIndex <= 3 ? "low-row" : "high-row";
        const cells = groups.map((group, groupIndex) => {
          const row = group.rows[rowIndex];
          return row.map((value, colIndex) => (
            `<td class="editable" contenteditable="true" data-group="${groupIndex}" data-row="${rowIndex}" data-col="${colIndex}">${fmt(value, 2)}</td>`
          )).join("");
        }).join("");
        return `<tr class="${cls}"><td class="density-cell">${density.label}</td>${cells}</tr>`;
      }).join("");
      const total = groups.map((group) => {
        const gradeTotal = group.rows.reduce((sum, row) => sum + (Number(row[0]) || 0), 0);
        const sampleTotal = group.rows.reduce((sum, row) => sum + (Number(row[2]) || 0), 0);
        const ash = weightedAsh(group.rows.map((row) => ({ ash: row[1], yield: row[2] })));
        return `<td>${fmt(gradeTotal, 2)}</td><td>${fmt(ash, 2)}</td><td>${fmt(sampleTotal, 2)}</td>`;
      }).join("");
      const slime = groups.map((group, groupIndex) => group.slime.map((value, colIndex) => (
        `<td class="editable" contenteditable="true" data-group="${groupIndex}" data-row="slime" data-col="${colIndex}">${fmt(value, 2)}</td>`
      )).join("")).join("");
      const all = groups.map((group) => {
        const sampleTotal = group.rows.reduce((sum, row) => sum + (Number(row[2]) || 0), 0) + (Number(group.slime[2]) || 0);
        const ash = weightedAsh([
          ...group.rows.map((row) => ({ ash: row[1], yield: row[2] })),
          { ash: group.slime[1], yield: group.slime[2] },
        ]);
        return `<td>100.00</td><td>${fmt(ash, 2)}</td><td>${fmt(sampleTotal, 2)}</td>`;
      }).join("");
      table.innerHTML = `
        <thead>
          <tr><th class="density-head" rowspan="3">密度级(kg/l)</th>${colGroup}</tr>
          <tr>${subHeads}</tr>
          <tr class="unit-row"><th>kg/l</th>${units}</tr>
        </thead>
        <tbody>
          ${bodyRows}
          <tr class="summary-row"><td class="density-cell">合计</td>${total}</tr>
          <tr><td class="density-cell">浮沉煤泥</td>${slime}</tr>
          <tr class="summary-row"><td class="density-cell">总计</td>${all}</tr>
        </tbody>
      `;
    }

    function renderResults() {
      const density = Number(densityInput.value) || 1.6;
      const results = groups.map((group) => calcGroup(group, density));
      cards.innerHTML = results.map((result) => `
        <article class="result-card">
          <h3>${result.size}</h3>
          <div class="metric-grid">
            <div class="metric clean"><span>精煤灰分</span><strong>${fmt(result.cleanAsh)}</strong></div>
            <div class="metric clean"><span>精煤产率</span><strong>${fmt(result.cleanYield)}</strong></div>
            <div class="metric reject"><span>矸石灰分</span><strong>${fmt(result.rejectAsh)}</strong></div>
            <div class="metric reject"><span>矸石产率</span><strong>${fmt(result.rejectYield)}</strong></div>
          </div>
        </article>
      `).join("");
      const first = results[0];
      document.getElementById("cleanFormula").textContent =
        `${first.size} 精煤灰分 = SUMPRODUCT(灰分低密度段, 占全样低密度段) / 精煤产率 = ${fmt(first.cleanAsh)}；精煤产率 = ${fmt(first.cleanYield)}`;
      document.getElementById("rejectFormula").textContent =
        `${first.size} 矸石灰分 = SUMPRODUCT(灰分高密度段, 占全样高密度段) / 矸石产率 = ${fmt(first.rejectAsh)}；矸石产率 = ${fmt(first.rejectYield)}`;
    }

    function updateCell(event) {
      const cell = event.target.closest("[data-group]");
      if (!cell) return;
      const groupIndex = Number(cell.dataset.group);
      const colIndex = Number(cell.dataset.col);
      const rowKey = cell.dataset.row;
      const value = Number(String(cell.textContent).replace(/,/g, "").trim());
      if (!Number.isFinite(value)) return;
      if (rowKey === "slime") {
        groups[groupIndex].slime[colIndex] = value;
      } else {
        groups[groupIndex].rows[Number(rowKey)][colIndex] = value;
      }
      renderResults();
    }

    function syncDensity(source) {
      const value = Number(source.value) || 1.6;
      densityInput.value = fmt(value, 1);
      densityRange.value = fmt(value, 1);
      renderResults();
    }

    function currentResults() {
      const density = Number(densityInput.value) || 1.6;
      return groups.map((group) => calcGroup(group, density)).map((result) => ({
        size: result.size,
        cleanAsh: Number(fmt(result.cleanAsh)),
        cleanYield: Number(fmt(result.cleanYield)),
        rejectAsh: Number(fmt(result.rejectAsh)),
        rejectYield: Number(fmt(result.rejectYield)),
      }));
    }

    function exportPayload() {
      return {
        version: 1,
        density: Number(densityInput.value) || 1.6,
        densityRows: densityRows.map((row) => row.label),
        groups: groups.map((group) => ({
          size: group.size,
          rows: group.rows.map((row, index) => ({
            density: densityRows[index].label,
            grade: Number(row[0]) || 0,
            ash: Number(row[1]) || 0,
            yield: Number(row[2]) || 0,
          })),
          slime: {
            grade: Number(group.slime[0]) || 0,
            ash: Number(group.slime[1]) || 0,
            yield: Number(group.slime[2]) || 0,
          },
        })),
        results: currentResults(),
      };
    }

    function downloadBlob(content, filename, type) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function csvEscape(value) {
      const text = String(value ?? "");
      return /[",\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
    }

    function toCsv() {
      const payload = exportPayload();
      const lines = [
        ["类型", "粒级", "密度级", "占本级", "灰分", "占全样", "精煤灰分", "精煤产率", "矸石灰分", "矸石产率"],
      ];
      payload.groups.forEach((group) => {
        const result = payload.results.find((item) => item.size === group.size) || {};
        group.rows.forEach((row) => {
          lines.push(["浮沉", group.size, row.density, row.grade, row.ash, row.yield, result.cleanAsh, result.cleanYield, result.rejectAsh, result.rejectYield]);
        });
        lines.push(["煤泥", group.size, "浮沉煤泥", group.slime.grade, group.slime.ash, group.slime.yield, result.cleanAsh, result.cleanYield, result.rejectAsh, result.rejectYield]);
      });
      return "\ufeff" + lines.map((line) => line.map(csvEscape).join(",")).join("\n");
    }

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let cell = "";
      let quoted = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        const next = text[i + 1];
        if (quoted && ch === "\"" && next === "\"") {
          cell += "\"";
          i++;
        } else if (ch === "\"") {
          quoted = !quoted;
        } else if (!quoted && ch === ",") {
          row.push(cell);
          cell = "";
        } else if (!quoted && (ch === "\n" || ch === "\r")) {
          if (ch === "\r" && next === "\n") i++;
          row.push(cell);
          if (row.some((item) => item.trim())) rows.push(row);
          row = [];
          cell = "";
        } else {
          cell += ch;
        }
      }
      row.push(cell);
      if (row.some((item) => item.trim())) rows.push(row);
      return rows;
    }

    function applyPayload(payload) {
      const nextGroups = payload.groups?.map((group) => {
        const rowsByDensity = Object.fromEntries((group.rows || []).map((row) => [row.density, row]));
        return {
          size: String(group.size || "").trim(),
          rows: densityRows.map((density) => {
            const row = rowsByDensity[density.label] || {};
            return [Number(row.grade) || 0, Number(row.ash) || 0, Number(row.yield) || 0];
          }),
          slime: [
            Number(group.slime?.grade) || 0,
            Number(group.slime?.ash) || 0,
            Number(group.slime?.yield) || 0,
          ],
        };
      }).filter((group) => group.size);
      if (!nextGroups?.length) throw new Error("没有识别到粒级数据");
      groups = nextGroups;
      if (Number.isFinite(Number(payload.density))) {
        densityInput.value = fmt(Number(payload.density), 1);
        densityRange.value = fmt(Number(payload.density), 1);
      }
      renderTable();
      renderResults();
    }

    function applyCsv(text) {
      const rows = parseCsv(text.replace(/^\ufeff/, ""));
      const header = rows.shift() || [];
      const index = (name) => header.findIndex((item) => item.trim() === name);
      const typeIndex = index("类型");
      const sizeIndex = index("粒级");
      const densityIndex = index("密度级");
      const gradeIndex = index("占本级");
      const ashIndex = index("灰分");
      const yieldIndex = index("占全样");
      if ([typeIndex, sizeIndex, densityIndex, gradeIndex, ashIndex, yieldIndex].some((i) => i < 0)) {
        throw new Error("CSV 表头需要包含：类型,粒级,密度级,占本级,灰分,占全样");
      }
      const map = new Map();
      rows.forEach((row) => {
        const size = String(row[sizeIndex] || "").trim();
        if (!size) return;
        if (!map.has(size)) map.set(size, { size, rows: [], slime: { grade: 0, ash: 0, yield: 0 } });
        const group = map.get(size);
        const item = {
          density: String(row[densityIndex] || "").trim(),
          grade: Number(row[gradeIndex]) || 0,
          ash: Number(row[ashIndex]) || 0,
          yield: Number(row[yieldIndex]) || 0,
        };
        if (String(row[typeIndex] || "").includes("煤泥")) {
          group.slime = { grade: item.grade, ash: item.ash, yield: item.yield };
        } else {
          group.rows.push(item);
        }
      });
      applyPayload({ groups: Array.from(map.values()) });
    }

    async function importFile(file) {
      const text = await file.text();
      if (/\.csv$/i.test(file.name)) {
        applyCsv(text);
      } else {
        applyPayload(JSON.parse(text));
      }
    }

    table.addEventListener("input", updateCell);
    table.addEventListener("blur", (event) => {
      const cell = event.target.closest("[data-group]");
      if (cell) cell.textContent = fmt(Number(cell.textContent), 2);
    }, true);
    densityInput.addEventListener("input", () => syncDensity(densityInput));
    densityRange.addEventListener("input", () => syncDensity(densityRange));
    document.getElementById("importBtn").addEventListener("click", () => document.getElementById("importFile").click());
    document.getElementById("importFile").addEventListener("change", async (event) => {
      const file = event.target.files?.[0];
      if (!file) return;
      try {
        await importFile(file);
      } catch (error) {
        alert(`导入失败：${error.message}`);
      } finally {
        event.target.value = "";
      }
    });
    document.getElementById("exportJsonBtn").addEventListener("click", () => {
      downloadBlob(JSON.stringify(exportPayload(), null, 2), "浮沉分选测试数据.json", "application/json;charset=utf-8");
    });
    document.getElementById("exportCsvBtn").addEventListener("click", () => {
      downloadBlob(toCsv(), "浮沉分选测试数据.csv", "text/csv;charset=utf-8");
    });
    document.getElementById("resetBtn").addEventListener("click", () => {
      groups = structuredClone(defaultGroups);
      renderTable();
      renderResults();
    });

    renderTable();
    renderResults();
  </script>
</body>
</html>
